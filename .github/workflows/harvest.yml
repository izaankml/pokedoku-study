name: Harvest pick stats

# Daily: fold yesterday's finished PokeDoku puzzle into the pick prior and
# snapshot today's board (scripts/harvest-pick-stats.ts). 06:30 UTC is
# safely past the daily rotation in every PokeDoku timezone. A push made
# with GITHUB_TOKEN doesn't fire the on-push Pages deploy, so the job
# dispatches deploy.yml itself.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: harvest

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/harvest-pick-stats.ts
      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data/pick-stats.json public/archive
          if git diff --cached --quiet; then
            echo "pick-stats unchanged; nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily pick-stats harvest"
          git push
          gh workflow run deploy.yml --ref main
